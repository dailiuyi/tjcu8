<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼气之窝 - 图片索引</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- shared-header:start -->
    <header class="header">
        <div class="logo">
            <img src="../image/logo.jpg" alt="">
            <span>呼气之窝</span>
        </div>
        <nav class="navigation" aria-label="主导航">
            <ul>
                <li><a href="../index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="services.html" aria-current="page">服务</a></li>
                <li><a href="contact.html">加入我们</a></li>
            </ul>
        </nav>
    </header>
    <!-- shared-header:end -->

    <main class="content" aria-labelledby="page-title">
        <h1 class="visually-hidden" id="page-title">图片索引</h1>
        <div class="box">
            <h2>图片链接索引</h2>
            <p class="gallery-status" id="gallery-status" role="status" aria-live="polite">正在加载图片索引…</p>
            <ul class="link-list" id="link-gallery">
                <!-- 列表项由 js/image-index.js 根据 JSON 数据生成。 -->
            </ul>
            <div class="preview-card" id="preview" role="status" aria-live="polite" aria-atomic="true" hidden>
                <p class="preview-status" id="preview-status">正在加载预览…</p>
                <img alt="" class="preview-image" id="preview-image" hidden>
            </div>
        </div>
    </main>

    <!-- shared-footer:start -->
    <footer>
        <p>&copy; 2024 呼气之窝. 保留所有权利.</p>
        <p>版权所有,未经许可不得转载.</p>
        <p class="strikethrough">收买h7不在版权考虑范围之内</p>
    </footer>
    <!-- shared-footer:end -->
    <script type="module" src="../js/image-index.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
